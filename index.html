		],
    }
    const modAltName={}
    for(const mod in modAltNameDict)
        for(const altName of modAltNameDict[mod])
            modAltName[altName]=mod

    function parsePool(raw){
        const pool={}
        let mod='NM'
        for(const token of raw.split(/[\n\t]/)){
            const word=token.trim()
            if(!word)continue
            if(word.match(/^-?\d+$/)){
                if(!(mod in pool))pool[mod]=[]
                pool[mod].push(word)
            }else{
                const altName=word.toLowerCase()
                mod=(altName in modAltName)?modAltName[altName]:word
            }
        }
        return pool
    }
    for(const round of Object.values(tournament.rounds))round.pool=parsePool(round.pool)

// 正文
function changeAll(fatherNode,varName,text){
    text=esc(String(text))
    for(const node of fatherNode.getElementsByClassName('v_'+varName)) node.innerHTML=text
}
changeAll(document,'tournament',tournament.name)

function esc(s){
    s = s.replace(/&/g,"&amp;")
    s = s.replace(/</g,"&lt;")
    s = s.replace(/>/g,"&gt;")
    s = s.replace(/　/g,"&emsp;")
    s = s.replace(/\'/g,"&#39;")
    s = s.replace(/\"/g,"&quot;")
    return s
}
const main=document.getElementById('main')
const general=document.getElementById('general')
const assistPoolOut=document.getElementById('assist_pool_out')
const assistPool=document.getElementById('assist_pool')
const assistPlayerOut=document.getElementById('assist_player_out')
const assistPlayer=document.getElementById('assist_player')
const configui=document.getElementById('configui')
let config=null
function toggleAssist(panel,status){
    const hidden=panel.classList.toggle('hidden')
    status.textContent=hidden?'显示':'隐藏'
}
document.getElementById('show_assist_pool').onclick=function(){
    toggleAssist(assistPoolOut,document.getElementById('show_assist_pool_statu'))
}
document.getElementById('show_assist_player').onclick=function(){

}
const assistPoolLine=document.getElementsByClassName('assist_pool_line')[0]
const assistPlayerLine=document.getElementsByClassName('assist_player_line')[0]

// 复制命令
{
    const mouse={x:0,y:0}
    const box0=document.getElementsByClassName('tip-box')[0]
    document.addEventListener('click', function(event){
        mouse.x = event.clientX
        mouse.y = event.clientY
    })
    function copyText(x,y=null){
        const input = document.createElement('textarea')
        document.body.appendChild(input)
        input.value = y===null?(x.title||x.textContent):y
        input.select()
        document.execCommand('Copy')
        document.body.removeChild(input)

        setTimeout(function(){
            const box = box0.cloneNode(true)
            document.body.appendChild(box)
            box.style.left = mouse.x + 'px'
            box.style.top = mouse.y + 'px'
            box.style.display = 'block'
            box.style.opacity = 1
            setTimeout(function(){
                box.style.opacity = 0.75
                setTimeout(function(){
                    box.style.opacity = 0.5
                },40)
                setTimeout(function(){
                    box.style.opacity = 0.25
                },80)
                setTimeout(function(){
                    box.style.opacity = 0
                    document.body.removeChild(box)
                },120)
            },500)
        },10)
    }
}

// commands
{
    function loadPart(partName){
        let thisPart=document.getElementsByClassName(partName)[0]
        let commands=part[partName]
        let fatherNode=(partName=='general'?general:thisPart).getElementsByClassName('command')[0]
        for(const command of commands){
            if(command){
                let nc=document.createElement('a')
                fatherNode.appendChild(nc)
                nc.setAttribute('href','javascript:void(0)')
                nc.setAttribute('onclick','copyText(this)')
                nc.innerHTML=esc(command).replace(/{/g,'<span class="v_').replace(/}/g,'"></span>')
            }else if(partName=='general'){
                fatherNode.appendChild(document.createElement('hr'))
            }else{
                let nf=document.createElement('div')
                nf.setAttribute('class','step hidden')
                fatherNode.appendChild(nf)
                fatherNode=nf
            }
        }
        part[partName]=thisPart
    }
    for(const partName in part)loadPart(partName)
    if(tournament.tbOnlyOne)part.tb.getElementsByClassName('selectTB')[0].classList.add('hidden')
}


function buildPool(round,settings){
    const pool={}
    for(const mod in round.pool){
        const pickable=mod=='TB'
            ?[false,!!settings.tbPickable,true]
            :[true,true,false]
        round.pool[mod].forEach((bid,index)=>{
            const name=round.pool[mod].length>1?mod+(index+1):mod
            pool[name]={
                bid,
                mod:settings.poolMod[mod],
                symbol:settings.poolSymbol[mod],
                pickable,
            }
        })
    }
    return pool
}

function buildMatchConfig(settings,roundName,red,blue){
    const round=settings.rounds[roundName]
    const pool=buildPool(round,settings)
    const tb=pool.TB?.bid||pool.TB1?.bid||Object.values(pool)[0]?.bid||null
    return {
        round:roundName,red,blue,events:round.events,
        gamestowin:round.events.replaceAll('b','').length,
        pool,tb,
    }
}

// 保存比赛记录
function normalizeMatchLink(input){
    const id=String(input).split('/').filter(Boolean).at(-1)
    return id?'https://osu.ppy.sh/community/matches/'+id+'\n':''
}

function formatMatchRecord(name,match,firstPick,matchLink,records){
    const bans={红队:'🟥ban',蓝队:'🟦ban'}
    let picks=''
    let scoreRed=''
    let scoreBlue=''
    let startupNote=''
    for(const record of records){
        if(record.hidden)continue
        const note=record.note?'（'+record.note+'）':''
        if(record.type=='startup'){
            startupNote=note?note+'\n':''
        }else if(record.type=='ban'){
            bans[record.color]+=' '+(record.map=='0'?'空':record.map)+note
        }else if(record.type=='pick'){
            picks+=(record.win=='red'?'🟥':'🟦')+'|'
                +(record.color=='红队'?'🟥':'🟦')+' '+record.map+note+'\n'
        }else if(record.type=='tb'){
            picks+=(record.win=='red'?'🟥':'🟦')+'|🟩 '+record.map+note+'\n'
        }else if(record.type=='settle'){
            scoreRed=record.sr
            scoreBlue=record.sb
            picks+=(scoreRed>scoreBlue?'🟥'+match.red.name:'🟦'+match.blue.name)
                +'获胜！'+note+'\n'
        }
    }
    const banText=firstPick=='red'
        ?bans['蓝队']+'\n'+bans['红队']
        :bans['红队']+'\n'+bans['蓝队']
    const title=name+' '+match.round+' '+match.red.name+' vs '+match.blue.name
    const text=name+' '+match.round+' \n'
        +normalizeMatchLink(matchLink)+'\n'
        +match.red.name+' '+scoreRed+':'+scoreBlue+' '+match.blue.name+'\n'
        +startupNote+'\n'+banText+'\n\n胜|选\n'+picks
    return {title,text}
}

function formatMainSheetText(firstPick,bans){
    const red=[]
    const blue=[]
    for(const ban of bans){
        if(ban.hidden||!ban.map)continue
        if(ban.color=='蓝队')blue.push(ban.map)
        else red.push(ban.map)
    }
    return (firstPick=='red'?'红队':'蓝队')+'\t'+red.join(' ')+'\t'+blue.join(' ')
}

let events=[]
let firstPick=null

function allTrue(x){
    for(const value of x)if(!value)return false
    return true
}

function eventTypesFromPattern(pattern){
    const types=['startup']
    for(const marker of pattern){
        if(marker=='b')types.push('ban','ban')
        else if(marker=='p')types.push('pick','pick')
        else if(marker=='t')types.push('tb')
    }
    types.push('settle')
    return types
}

function scoreAfter(previous,winner){
    return {
        sr:previous.sr+(winner=='red'?1:0),
        sb:previous.sb+(winner=='blue'?1:0),
    }
}

function turnAssignments(types,firstPick,redName,blueName){
    const firstPickOffset=firstPick=='red'?1:0
    return types.map((type,index)=>{
        if(type!='ban'&&type!='pick')return null
        const isBan=type=='ban'?1:0
        const blue=!!((index&1)^firstPickOffset^isBan)
        return {color:blue?'蓝队':'红队',team:blue?blueName:redName}
    })
}

const firstPickRegulator=document.createElement('div')
firstPickRegulator.setAttribute('class','part hidden')

function makeFinish(n,finish=true,settle=false){
    n=parseInt(n)
    const event=events[n]
    const l=events.length-1
    if(finish){
        event.finish=true
        if(settle){
            for(let i=n+1;i<l;i++)events[i].dom.classList.add('hidden')
            events[l].sr=events[n].sr
            events[l].sb=events[n].sb
            partOnChange(null,l)
        }else partOnChange(null,n+1)
    }else{
        event.finish=false
        for(let i=n+1;i<=l;i++)events[i].dom.classList.add('hidden')
    }
}

function readEventSelection(event,settings){
    const selects=event.dom.getElementsByTagName('select')
    if(event.type=='startup')return {firstPick:selects[0].value}
    if(event.type=='ban')return {map:selects[0].value}
    if(event.type=='pick')return {map:selects[0].value,win:selects[1].value}
    if(event.type=='tb')return {
        map:settings.tbOnlyOne?(selects[0].options[1]?.value||''):selects[0].value,
        win:selects[1].value,
    }
    return {}
}

function calculateEvent(event,previous,input,match,settings){
    const values={}
    let steps=[]
    const state={}
    if(event.type=='startup'){
        state.sr=0
        state.sb=0
        if(input.firstPick){
            const firstBan=input.firstPick=='red'?'blue':'red'
            values.fp_t=match[input.firstPick].name
                +'（'+(input.firstPick=='red'?'红队':'蓝队')+'）'
            values.fb_t=match[firstBan].name
                +'（'+(firstBan=='red'?'红队':'蓝队')+'）'
        }
        steps=[input.firstPick!='']
    }else if(event.type=='ban'){
        state.sr=previous.sr
        state.sb=previous.sb
        state.map=input.map
        values.color=event.color
        values.team=event.team
        values.map=input.map
        if(input.map)values.bid=input.map=='0'?'空':match.pool[input.map].bid
        steps=[input.map!='']
    }else if(event.type=='pick'||event.type=='tb'){
        Object.assign(state,scoreAfter(previous,input.win))
        state.map=input.map
        state.win=input.win
        values.map=input.map
        values.win=input.win
        values.sr=state.sr
        values.sb=state.sb
        if(event.type=='pick'){
            values.color=event.color
            values.team=event.team
        }
        if(input.map){
            values.bid=match.pool[input.map].bid
            values.mod=match.pool[input.map].mod
        }
        steps=event.type=='tb'&&settings.tbOnlyOne
            ?[input.win!='']
            :[input.map!='',input.win!='']
    }else if(event.type=='settle'){
        values.team=event.sr>event.sb?match.red.name:match.blue.name
    }
    return {state,values,steps}
}

function partOnChange(thisPart,n=null){
    if(n===null){
        while(!thisPart.classList.contains('part'))thisPart=thisPart.parentNode
        n=events.findIndex(item=>item.dom==thisPart)
    }
    n=Number(n)
    const event=events[n]
    event.dom.classList.remove('hidden')
    const input=readEventSelection(event,tournament)

    if(event.type=='startup'){
        window.onbeforeunload=function(){return '确认要退出吗？'}
        firstPick=input.firstPick
        try{
            if(firstPick=='red')main.insertBefore(firstPickRegulator,event.dom)
            if(firstPick=='blue')main.removeChild(firstPickRegulator)
        }catch{}
        if(firstPick){
            const assignments=turnAssignments(
                events.map(item=>item.type),firstPick,config.red.name,config.blue.name
            )
            for(const i in events){
                if(!assignments[i])continue
                events[i].color=assignments[i].color
                events[i].team=assignments[i].team
            }
        }
    }

    const result=calculateEvent(event,events[n-1],input,config,tournament)
    Object.assign(event,result.state)
    for(const key in result.values)changeAll(event.dom,key,result.values[key])
    result.steps.forEach((complete,index)=>{
        const nodeClass=event.dom.getElementsByClassName('step')[index].classList
        nodeClass.toggle('hidden',!complete)
    })
    if(event.type!='settle'){
        const settled=event.sr>=config.gamestowin||event.sb>=config.gamestowin
        makeFinish(n,allTrue(result.steps),settled)
    }
}

function addEvent(type){
    const dom=part[type].cloneNode(true)
    main.appendChild(dom)
    events.push({dom,type,finish:false,sr:null,sb:null})
}

    assistPlayer.innerHTML=''
    function addAssistPlayerLine(player,pre=''){
        let nl=assistPlayerLine.cloneNode(true)
        let ncA=nl.getElementsByTagName('a')[0]
        if(player){
            ncA.setAttribute('href','javascript:void(0)')
            ncA.setAttribute('onclick','copyText(this)')
            ncA.setAttribute('title', `!MP INVITE ${player}`)
        }
        ncA.innerHTML=pre+player
        assistPlayer.appendChild(nl)
    }
    for(const player of config.red.player)addAssistPlayerLine(player,'<span class="emoji">🟥</span>')
    for(const player of config.blue.player)addAssistPlayerLine(player,'<span class="emoji">🟦</span>')

    for(const type of eventTypesFromPattern(config.events))addEvent(type)
}
